[package]
name = "octoscript_android_probe"
version = "0.1.0"
edition = "2021"

[lib]
name = "octoscript_android_probe"
crate-type = ["cdylib"]

# The real thing: the backend-agnostic Octoscript renderer core. Depends only on
# makepad-script (the VM). No makepad-platform / draw / widgets anywhere.
[dependencies]
octoscript-render = { path = "/Users/yuechen/home/Octoscript-Makepad/crates/octoscript-render" }
jni = "0.21"

[profile.release]
opt-level = 2
