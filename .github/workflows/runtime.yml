name: Shared runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/Octoscript-Android
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Octoscript-Makepad
        working-directory: workspace/Octoscript-Android
        run: python tools/setup-native.py
      - name: Compile with the shared runtime
        working-directory: workspace/Octoscript-Android
        run: |
          cargo check --locked --manifest-path catalog/rust/Cargo.toml
          cargo check --locked --manifest-path probe/rust/Cargo.toml
      - name: Reject divergent runtime sources
        working-directory: workspace/Octoscript-Android
        run: |
          python tools/setup-native.py --check --cargo-manifest catalog/rust/Cargo.toml
          python tools/setup-native.py --check --cargo-manifest probe/rust/Cargo.toml
